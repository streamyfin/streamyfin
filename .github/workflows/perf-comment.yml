name: 🐢 Performance Comment

# Posts the Reassure comparison from perf.yml on its PR. Split from perf.yml
# because a PR from a fork runs that one with a read-only token. This one never
# checks out or runs PR code: it reads the uploaded markdown and posts it.

on:
  workflow_run:
    workflows:
      - "🐢 Performance"
    types:
      - completed

permissions:
  contents: read

jobs:
  comment:
    name: 📝 Post Reassure results
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: 📥 Download results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const artifact = data.artifacts.find((a) => a.name === "reassure");
            if (!artifact) {
              core.setFailed("No reassure artifact on the run.");
              return;
            }
            const zip = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: "zip",
            });
            require("node:fs").writeFileSync("reassure.zip", Buffer.from(zip.data));

      - name: 📂 Unpack results
        run: unzip -o reassure.zip -d reassure

      - name: 💬 Comment on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require("node:fs");
            // Written by the PR's own run, so it is checked before use.
            const number = Number(fs.readFileSync("reassure/pr-number", "utf8").trim());
            if (!Number.isInteger(number) || number <= 0) {
              core.setFailed("The artifact names no PR.");
              return;
            }
            // And it has to be the PR this run measured, not another one.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            if (pr.head.sha !== context.payload.workflow_run.head_sha) {
              core.setFailed(`PR #${number} is not the one this run measured.`);
              return;
            }
            // No report is written without a baseline to compare against.
            if (!fs.existsSync("reassure/comment.md")) {
              core.notice("The run produced no comparison, nothing to post.");
              return;
            }
            // unzip keeps symlinks and readFileSync follows them, so a link to
            // /proc/self/environ would post this job's token.
            if (!fs.lstatSync("reassure/comment.md").isFile()) {
              core.setFailed("The report is not a regular file.");
              return;
            }
            // The PR wrote this file too, so it is posted as text only: capped
            // under the comment size limit, with mentions defused.
            const report = fs
              .readFileSync("reassure/comment.md", "utf8")
              .slice(0, 60000)
              .replaceAll("@", "@\u200b");
            const marker = "<!-- reassure-performance -->";
            const run = context.payload.workflow_run.html_url;
            const body = `${marker}\n${report}\n[Full report in the job summary](${run})`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
            });
            // Anyone can post the marker, so only this workflow's own comment counts.
            const previous = comments.find(
              (c) =>
                c.user?.login === "github-actions[bot]" &&
                c.body?.startsWith(marker),
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body,
              });
            }
