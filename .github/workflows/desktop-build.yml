name: 🖥️ Build Desktop

# Manual / release-only on purpose: the desktop artifacts are large and this
# does not need to run on every pull request.
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux (AppImage + deb)
            target: linux
          - os: windows-latest
            name: Windows (NSIS + portable)
            target: win

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Build the web bundle
        run: bun run build:desktop

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Package
        working-directory: desktop
        # Unsigned: there is no certificate in CI, and electron-builder would
        # otherwise try to discover one and fail.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --${{ matrix.target }} --publish never --config electron-builder.config.js

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: streamyfin-desktop-${{ matrix.target }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.exe
          if-no-files-found: error

  publish:
    name: Attach to release
    # Only when a release triggered this run; a manual dispatch just leaves the
    # artifacts on the workflow run.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to the release
        # The tag and repo go through the environment, never through `${{ }}`
        # interpolation into the script body: GitHub expands those before Bash
        # parses the line, so a tag containing $() would execute here — in a job
        # holding contents: write.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" \
            artifacts/*.AppImage artifacts/*.deb artifacts/*.exe \
            --repo "$TARGET_REPO" --clobber
