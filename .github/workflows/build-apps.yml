          # code can find this IPA and repack it.
          name: ${{ env.FINGERPRINT != '' && format('streamyfin-ios-phone-ipa-fp-{0}', env.FINGERPRINT) || format('streamyfin-ios-phone-ipa-{0}', env.DATE_TAG) }}
          path: |
            build-*.ipa
            build/*.ipa
          retention-days: 7
          # The name is the same on a re-run of this run, which keeps its artifacts.
          overwrite: true

      - name: 🔄 Refresh PR build comment
        uses: ./.github/actions/refresh-pr-comment

