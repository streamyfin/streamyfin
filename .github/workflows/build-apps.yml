  build-ios-phone:
    needs: [fingerprint, repack-ios-phone]
    # always() keeps a skipped repack job from skipping this required check,
    # which would count as a pass. The full build runs when no earlier IPA can
    # be repacked or the repack job did not succeed.
    if: ${{ always() && !cancelled() && !contains(github.event.head_commit.message, '[skip ci]') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'streamyfin/streamyfin') && (needs.fingerprint.outputs.ios_phone_source == '' || needs.repack-ios-phone.result != 'success') }}
    runs-on: xcode-27
    name: 🍎 Build iOS IPA (Phone)
    permissions:
      contents: read
      actions: write # dispatch artifact-comment.yml to refresh the PR comment
    env:
      FINGERPRINT: ${{ needs.fingerprint.outputs.ios_hash }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          show-progress: false

      - parallel:
          - name: 🍞 Setup Bun
            uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
            with:
              # renovate: datasource=npm depName=bun
              bun-version: "1.4.4"

          - name: 🏗️ Setup EAS
            uses: expo/expo-github-action@eab7a230208c952974db8c3245cfd78402c7b385 # main
            with:
              eas-version: latest
              token: ${{ secrets.EXPO_TOKEN }}
              eas-cache: true

      - name: 💾 Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: 📦 Install dependencies
        run: |
          bun install --frozen-lockfile

      - name: 🛠️ Generate project files
        run: bun run prebuild

      - name: 🚀 Build iOS app
        env:
          EXPO_TV: 0
