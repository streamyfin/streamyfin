# Test workflow to quickly generate artifacts for testing the artifact comment workflow
name: 🧪 Test Artifact Generator

on:
    workflow_dispatch:
    pull_request:
        branches: [develop, main]

jobs:
    generate-test-artifacts:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                platform: [android, ios]
                device: [phone, tv]

        steps:
            - name: Generate test artifact
              run: |
                  mkdir -p test-build
                  echo "Test build for ${{ matrix.platform }} ${{ matrix.device }}" > test-build/README.txt
                  echo "Generated at: $(date)" >> test-build/README.txt
                  echo "Platform: ${{ matrix.platform }}" >> test-build/README.txt
                  echo "Device: ${{ matrix.device }}" >> test-build/README.txt

                  if [ "${{ matrix.platform }}" = "android" ]; then
                    echo "Simulated APK content" > test-build/app-${{ matrix.device }}.apk
                  else
                    echo "Simulated IPA content" > test-build/app-${{ matrix.device }}.ipa
                  fi

            - name: Upload test artifact
              uses: actions/upload-artifact@v4
              with:
                  name: test-${{ matrix.platform }}-${{ matrix.device }}
                  path: test-build/
                  retention-days: 1
