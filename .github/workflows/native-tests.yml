name: 🧪 Native tests

# Unit tests of the native modules (JUnit under modules/*/android/src/test). They only run
# when a module changes: the Android project has to be generated first, which costs minutes.

on:
  pull_request:
    branches: [develop, master]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 🔎 Module changes
    runs-on: ubuntu-26.04
    outputs:
      modules: ${{ steps.filter.outputs.modules }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          show-progress: false

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            modules:
              - 'modules/**'
              - '.github/workflows/native-tests.yml'

  android-unit:
    name: 🤖 Android module unit tests
    needs: changes
    if: needs.changes.outputs.modules == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          show-progress: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=npm depName=bun
          bun-version: "1.4.2"

      - name: ☕ Set up JDK 17
        # Same pin as build-apps.yml: the default JDK of ubuntu-26.04 breaks the RN/AGP build.
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: 💾 Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: 💾 Cache Gradle global
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🛠️ Generate project files
        run: bun run prebuild

      - name: 🧪 Run the module unit tests
        working-directory: android
        run: ./gradlew :mpv-player:testDebugUnitTest --no-daemon

      - name: 📤 Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-unit-test-reports
          path: |
            android/**/build/test-results/**
            android/**/build/reports/tests/**
          retention-days: 7
