name: 🐢 Performance

# Measures the Reassure scenarios (*.perf-test.tsx) on the PR's base and on the
# PR, and compares them. Runs with a read-only token, so a PR from a fork is
# measured like any other; perf-comment.yml posts the result once this ends.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Each scenario runs on the base and on the PR, so a PR that cannot move
    # them (translations, docs, native only) does not pay for it.
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "providers/**"
      - "services/**"
      - "utils/**"
      - "constants/**"
      - "test-utils/**"
      - "**/*.perf-test.*"
      - "jest.perf.config.js"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/perf*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reassure:
    name: 🐢 Reassure
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref || 'develop' }}
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # The steps below run PR code, which has no use for the token.
          persist-credentials: false

      - name: 🍞 Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # renovate: datasource=npm depName=bun
          bun-version: "1.4.2"

      - name: 💾 Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: 📏 Measure the base
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          git switch --detach "origin/$BASE_REF"
          bun install --frozen-lockfile
          bun run --if-present perf:baseline
          git switch --detach "$HEAD_SHA"

      - name: 📏 Measure the PR
        run: |
          bun install --frozen-lockfile
          bun run perf

      - name: 📝 Job summary
        if: always()
        run: |
          if [ -f .reassure/output.md ]; then
            cat .reassure/output.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: ✂️ Filter the report for the comment
        if: github.event_name == 'pull_request'
        run: |
          if [ -f .reassure/output.json ]; then
            bun scripts/reassure-report.ts .reassure/output.json .reassure/comment.md
          fi

      - name: 🔢 Record the PR number
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > .reassure/pr-number

      - name: 📦 Upload results artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reassure
          path: |
            .reassure/comment.md
            .reassure/pr-number
          retention-days: 7
