name: 🔒 Lockfile Consistency Check

on:
  pull_request:
    branches: [develop, master]
  merge_group:
    types: [checks_requested]
  push:
    branches: [develop, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-lockfile:
    name: 🔍 Check bun.lock and package.json consistency
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    steps:
      - parallel:
          - name: 📥 Checkout repository
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              ref: ${{ github.event.pull_request.head.sha || github.sha }}
              show-progress: false
              submodules: recursive

          - name: 🍞 Setup Bun
            uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
            with:
              # renovate: datasource=npm depName=bun
              bun-version: "1.4.2"

      - name: 💾 Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: 🛡️ Verify lockfile consistency
        run: |
          set -euxo pipefail
          echo "➡️ Checking for discrepancies between bun.lock and package.json..."
          bun install --frozen-lockfile --dry-run --ignore-scripts
          echo "✅ Lockfile is consistent with package.json!"

      - name: 🩹 Verify patched dependencies still apply
        run: bun scripts/check-patched-deps.ts
