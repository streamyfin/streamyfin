name: Repack iOS IPA
description: >-
  Download an IPA that an earlier run built from the same native fingerprint,
  put this commit's JS bundle into it with `@expo/repack-app`, and write the
  result to `build/Streamyfin.ipa`. Runs on Linux, so it needs no macOS runner.
  `scripts/ci/find-native-build.ts` decides which earlier run is safe to reuse.

inputs:
  source-run-id:
    description: The run that uploaded the IPA to repack.
    required: true
  artifact-name:
    description: The name of that run's IPA artifact.
    required: true
  tv:
    description: '"1" to bundle the tvOS JS, "0" for the phone.'
    required: true
  expo-token:
    description: >-
      An EAS token to fetch the App Store signing files with. Leave empty for
      an unsigned IPA.
    required: false
    default: ""
  bundle-identifiers:
    description: >-
      The bundle identifiers to sign, separated by spaces: the app and each
      extension it embeds. Read only when `expo-token` is set.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: 📥 Download the source IPA
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SOURCE_RUN_ID: ${{ inputs.source-run-id }}
        ARTIFACT_NAME: ${{ inputs.artifact-name }}
      run: |
        gh run download "$SOURCE_RUN_ID" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT_NAME" -D "$RUNNER_TEMP/source"
        find "$RUNNER_TEMP/source" -name '*.ipa' -print -quit | xargs -I{} mv {} "$RUNNER_TEMP/source.ipa"

    - name: 🔏 Fetch the signing files from EAS
      id: signing
      if: inputs.expo-token != ''
      shell: bash
      env:
        EXPO_TOKEN: ${{ inputs.expo-token }}
        BUNDLE_IDENTIFIERS: ${{ inputs.bundle-identifiers }}
      run: |
        read -ra ids <<< "$BUNDLE_IDENTIFIERS"
        bun scripts/ci/fetch-ios-credentials.ts "$RUNNER_TEMP/signing" "${ids[@]}"

    - name: 📦 Repack with this commit's JS
      shell: bash
      env:
        # repack-app defaults NODE_ENV to development, which bundles the JS with
        # Babel's development transforms and `.env.development`. A repacked IPA
        # must match an Xcode Release build, so production must be explicit.
        NODE_ENV: production
        EXPO_TV: ${{ inputs.tv }}
        SIGNED: ${{ inputs.expo-token != '' }}
        CERTIFICATE_PASSWORD: ${{ steps.signing.outputs.password }}
      run: |
        mkdir -p build
        args=(-p ios --source-app "$RUNNER_TEMP/source.ipa" -w "$RUNNER_TEMP/repack" -o build/Streamyfin.ipa)
        if [ "$SIGNED" = "true" ]; then
          # With --certificate, repack-app signs with zsign, which needs no Xcode.
          args+=(--certificate "$RUNNER_TEMP/signing/identity.p12" --key-password "$CERTIFICATE_PASSWORD"
            --provisioning-profile "$(cat "$RUNNER_TEMP/signing/profiles.json")")
        fi
        bunx repack-app "${args[@]}" .

    - name: 🧹 Delete the signing files
      if: always() && inputs.expo-token != ''
      shell: bash
      run: rm -rf "$RUNNER_TEMP/signing"
