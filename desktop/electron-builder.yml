appId: app.streamyfin.desktop
productName: Streamyfin
copyright: Streamyfin contributors

directories:
  output: release
  buildResources: build

# main.js/preload.js live here; the Expo web export is copied in from the repo
# root, where `bun run build:desktop` writes it.
files:
  - main.js
  - preload.js
  - icon.png
  - package.json

# The web export goes in extraResources, NOT files/asar. Expo emits icon fonts
# to dist-web/assets/node_modules/@expo/vector-icons/…, and electron-builder
# filters any `node_modules` path out of the asar — silently dropping every
# .ttf, which makes all icons render as tofu squares. extraResources copies
# verbatim with no such filtering. main.js resolves it via process.resourcesPath.
extraResources:
  - from: ../dist-web
    to: dist-web

# The renderer is a local bundle with no native deps, so nothing to rebuild.
npmRebuild: false

win:
  target:
    # nsis = installer with shortcuts; portable = one self-contained .exe that
    # needs no install and no runtime on the machine.
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: icon.png
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-${version}-portable.exe

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Streamyfin

linux:
  # AppImage is the self-contained one: a single executable file, no install.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  category: AudioVideo
  icon: icon.png
  synopsis: Jellyfin client
  description: Streamyfin desktop client for Jellyfin media servers.
