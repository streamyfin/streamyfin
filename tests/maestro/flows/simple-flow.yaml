appId: ${MAESTRO_APP_ID}
name: SimpleFlow
---
- clearState
- launchApp
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/00-launched-raw
- extendedWaitUntil:
    visible:
      id: "server-url-input"
    timeout: 60000
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/01-launched
- tapOn:
    id: "server-url-input"
- inputText: "${MAESTRO_LOGIN_SERVER_URL}"
- hideKeyboard
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/02-server-url-entered
- tapOn:
    id: "connect-button"
- extendedWaitUntil:
    visible: "Username"
    timeout: 30000
- assertVisible: "Password"
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/03-login-screen
- tapOn:
    id: "username-input"
- inputText: "${MAESTRO_USERNAME}"
- runFlow:
    when:
      true: ${MAESTRO_PASSWORD != null && MAESTRO_PASSWORD.length > 0}
    commands:
      - tapOn:
          id: "password-input"
      - inputText: "${MAESTRO_PASSWORD}"
- hideKeyboard
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/04-credentials-entered
- tapOn:
    id: "login-button"
- extendedWaitUntil:
    visible: "Home|Welcome to Streamyfin|Continue Watching|Next Up|No Items"
    timeout: 45000
- runFlow:
    when:
      visible: "Welcome to Streamyfin"
    commands:
      - takeScreenshot:
          path: ${MAESTRO_ARTIFACT_DIR}/05-intro-screen
      - tapOn:
          id: "intro-done-button"
- extendedWaitUntil:
    visible: "Home|Continue Watching|Next Up|No Items"
    timeout: 30000
- assertNotVisible: "Welcome to Streamyfin"
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/06-home
