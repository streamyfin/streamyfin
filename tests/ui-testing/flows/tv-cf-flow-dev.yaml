appId: ${MAESTRO_APP_ID}
name: TVCF-FlowDev
---
- extendedWaitUntil:
    visible: "Add Server|Enter the URL to your Jellyfin server"
    timeout: 30000
- runFlow:
    when:
      visible: "Add Server"
    commands:
      - tapOn: "Add Server"
- extendedWaitUntil:
    visible: "Enter the URL to your Jellyfin server"
    timeout: 30000
# Android TV focus starts on the URL input. Navigate to Advanced, then choose
# the Cloudflare preset with the remote D-pad.
- pressKey: "Remote Dpad Down"
- pressKey: "Remote Dpad Down"
- pressKey: "Remote Dpad Center"
- extendedWaitUntil:
    visible: "Cloudflare Zero Trust"
    timeout: 10000
- pressKey: "Remote Dpad Down"
- pressKey: "Remote Dpad Center"
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/02-cloudflare-preset
- extendedWaitUntil:
    visible: "Header value"
    timeout: 10000
# Focus is on the Cloudflare preset. Move past the first header name to the
# first Header value field.
- pressKey: "Remote Dpad Down"
- pressKey: "Remote Dpad Down"
- pressKey: "Remote Dpad Down"
- pressKey: "Remote Dpad Center"
- inputText: "${MAESTRO_CF_ACCESS_CLIENT_ID}"
- hideKeyboard
# Move from the first Header value field to the second Header value field.
- pressKey: "Remote Dpad Down"
- pressKey: "Remote Dpad Down"
- pressKey: "Remote Dpad Center"
- inputText: "${MAESTRO_CF_ACCESS_CLIENT_SECRET}"
- hideKeyboard
# Move back to the URL input, enter the server URL, then move down to Connect.
- pressKey: "Remote Dpad Up"
- pressKey: "Remote Dpad Up"
- pressKey: "Remote Dpad Up"
- pressKey: "Remote Dpad Up"
- pressKey: "Remote Dpad Up"
- pressKey: "Remote Dpad Up"
- pressKey: "Remote Dpad Up"
- pressKey: "Remote Dpad Up"
- pressKey: "Remote Dpad Up"
- pressKey: "Remote Dpad Up"
- pressKey: "Remote Dpad Center"
- inputText: "${MAESTRO_SERVER_URL}"
- hideKeyboard
- pressKey: "Remote Dpad Down"
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/03-cloudflare-headers-entered
- pressKey: "Remote Dpad Center"
- extendedWaitUntil:
    visible: "Username"
    timeout: 60000
- assertVisible: "Password"
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/04-login-screen
- tapOn: "Username"
- inputText: "${MAESTRO_USERNAME}"
- runFlow:
    when:
      true: ${MAESTRO_PASSWORD != null && MAESTRO_PASSWORD.length > 0}
    commands:
      - tapOn: "Password"
      - inputText: "${MAESTRO_PASSWORD}"
- hideKeyboard
- tapOn:
    text: "Log In"
    enabled: true
- extendedWaitUntil:
    visible: "Home|Welcome to Streamyfin|Continue Watching|Next Up|No Items"
    timeout: 60000
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/05-home
