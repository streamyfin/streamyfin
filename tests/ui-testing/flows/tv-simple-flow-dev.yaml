appId: ${MAESTRO_APP_ID}
name: TVSimpleFlowDev
---
- extendedWaitUntil:
    visible: "Add Server|Enter the URL to your Jellyfin server"
    timeout: 30000
- runFlow:
    when:
      visible: "Add Server"
    commands:
      - tapOn: "Add Server"
- extendedWaitUntil:
    visible: "Enter the URL to your Jellyfin server"
    timeout: 30000
- assertVisible: "Enter the URL to your Jellyfin server"
- tapOn: "http\\(s\\)://your-server\\.com"
- inputText: "${MAESTRO_SERVER_URL}"
- hideKeyboard
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/02-server-url-entered
- tapOn:
    text: "Connect"
    enabled: true
- extendedWaitUntil:
    visible: "Username"
    timeout: 60000
- assertVisible: "Password"
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/03-login-screen
- tapOn: "Username"
- inputText: "${MAESTRO_USERNAME}"
- runFlow:
    when:
      true: ${MAESTRO_PASSWORD != null && MAESTRO_PASSWORD.length > 0}
    commands:
      - tapOn: "Password"
      - inputText: "${MAESTRO_PASSWORD}"
- hideKeyboard
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/04-credentials-entered
- tapOn:
    text: "Log In"
    enabled: true
- extendedWaitUntil:
    visible: "Home|Welcome to Streamyfin|Continue Watching|Next Up|No Items"
    timeout: 60000
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/05-home
