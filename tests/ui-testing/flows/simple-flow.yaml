appId: ${MAESTRO_APP_ID}
name: SimpleFlow
---
- clearState
- launchApp
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/01-launched
- assertVisible: "Streamyfin"
# Handle Expo dev client launcher screen (appears after clearState)
- runFlow:
    when:
      visible: "DEVELOPMENT SERVERS"
    commands:
      - tapOn: "http://10.0.2.2:8081"
      - extendedWaitUntil:
          visible: "Continue"
          timeout: 15000
      - tapOn: "Continue"
- runFlow: tests/ui-testing/flows/simple-flow-dev.yaml
