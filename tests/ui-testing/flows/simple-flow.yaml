appId: ${MAESTRO_APP_ID}
name: SimpleFlow
---
- clearState
- launchApp
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/01-launched
- assertVisible: "Streamyfin"
- assertVisible: "Enter the URL to your Jellyfin server"
- tapOn: "Server URL"
- inputText: "${MAESTRO_SERVER_URL}"
- hideKeyboard
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/02-server-url-entered
- tapOn:
    text: "Connect"
    enabled: true
- extendedWaitUntil:
    visible: "Username"
    timeout: 30000
- assertVisible: "Password"
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/03-login-screen
- tapOn: "Username"
- inputText: "${MAESTRO_USERNAME}"
- runFlow:
    when:
      true: ${MAESTRO_PASSWORD != ""}
    commands:
      - tapOn: "Password"
      - inputText: "${MAESTRO_PASSWORD}"
- hideKeyboard
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/04-credentials-entered
- tapOn:
    text: "Log In"
    enabled: true
- extendedWaitUntil:
    visible: "Home|Welcome to Streamyfin|Continue Watching|Next Up|No Items"
    timeout: 45000
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/05-home
