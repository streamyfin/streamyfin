appId: ${MAESTRO_APP_ID}
name: CF-Flow
---
- runFlow: _launch.yaml
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/01-launched
- tapOn:
    id: "advanced-custom-headers"
- tapOn: "Cloudflare Zero Trust"
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/02-cloudflare-preset
- tapOn: "Server URL"
- inputText: "${MAESTRO_SERVER_URL}"
- pressKey: Enter
- tapOn:
    id: "header-value-CF-Access-Client-Id"
- inputText: "${MAESTRO_CF_ACCESS_CLIENT_ID}"
- pressKey: Enter
- tapOn:
    id: "header-value-CF-Access-Client-Secret"
- inputText: "${MAESTRO_CF_ACCESS_CLIENT_SECRET}"
- pressKey: Enter
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/03-cloudflare-headers-entered
- runFlow: _connect.yaml
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/04-login-screen
- runFlow: _login.yaml
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/05-home
