appId: ${MAESTRO_APP_ID}
name: TVCF-Flow
---
- clearState
- launchApp
- extendedWaitUntil:
    visible: "Add Server|Enter the URL to your Jellyfin server"
    timeout: 30000
- takeScreenshot:
    path: ${MAESTRO_ARTIFACT_DIR}/01-launched
- runFlow:
    when:
      visible: "Add Server"
    commands:
      - tapOn: "Add Server"
- extendedWaitUntil:
    visible: "Enter the URL to your Jellyfin server"
    timeout: 30000
- runFlow: tv-cf-flow-dev.yaml
