buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : '2.1.20'}")
  }
}

apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.mpvplayer'
version = '0.7.6'

expoModule {
  canBePublished false
}

// Tier 1 builds only (e2e/README.md, "Fake Cast receivers"): fake receivers in place of the Cast SDK's.
// Passed as -PstreamyfinFakeCastDevices=true, or ORG_GRADLE_PROJECT_streamyfinFakeCastDevices=true; no
// store build sets it.
def fakeCastDevices = (findProperty("streamyfinFakeCastDevices") ?: "false").toString().toBoolean()
// A store build refuses them, whatever lingers in its environment: EAS names the profile it builds.
def easBuildProfile = System.getenv("EAS_BUILD_PROFILE") ?: ""
if (fakeCastDevices && easBuildProfile.startsWith("production")) {
  throw new GradleException("streamyfinFakeCastDevices is set for the store profile '${easBuildProfile}': fake Cast receivers never ship")
}

android {
  namespace "expo.modules.mpvplayer"
  defaultConfig {
    versionCode 1
    versionName "0.7.6"
    ndk {
      // Architectures supported by mpv-android
      abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
    }
    // The Cast options provider is reached by name from the manifest, which R8 does not see.
    consumerProguardFiles 'proguard-rules.pro'
    buildConfigField "boolean", "FAKE_CAST_DEVICES", fakeCastDevices.toString()
  }
  buildFeatures {
    compose true
    buildConfig true
  }
  testOptions {
    unitTests.all {
      // The receiver protocol vectors live at the repository root, shared with Jest and the bench.
      def vectors = file("../../../e2e/fixtures/receiver-protocol")
      // Read at run time, so declared as an input: an edited vector would otherwise leave the task UP-TO-DATE.
      inputs.dir(vectors).withPropertyName("receiverProtocolVectors").withPathSensitivity(PathSensitivity.RELATIVE)
      systemProperty "receiverProtocolVectors", vectors.absolutePath
      // What the build asked for, so FakeCastDevicesWiringTest can check BuildConfig against it.
      systemProperty "streamyfinFakeCastDevices", fakeCastDevices.toString()
    }
  }
  sourceSets {
    main {
      jniLibs.srcDirs = ['libs']
    }
  }
}

dependencies {
  // libmpv from Maven Central
  implementation 'dev.jdtech.mpv:libmpv:1.0.0'

  // Jetpack Compose dependencies matching @expo/ui
  implementation 'androidx.compose.foundation:foundation-android:1.12.1'
  implementation 'androidx.compose.ui:ui-android:1.12.1'
  implementation "androidx.compose.material3:material3:1.5.0-rc01"
  implementation 'androidx.compose.material3:material3-android:1.5.0-rc01'
  implementation 'androidx.compose.material:material-icons-core:1.7.8'
  implementation 'androidx.compose.material:material-icons-extended:1.7.8'
  implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
  implementation 'androidx.activity:activity-ktx:1.13.0'
  implementation 'androidx.savedstate:savedstate-ktx:1.5.0'
  implementation 'androidx.core:core-ktx:1.19.1'
  // Android TV Compose material
  implementation 'androidx.tv:tv-material:1.1.0'

  // Media3/ExoPlayer engine for the native chrome (ExoPlayerEngine). Same
  // coordinates and versions as modules/exoplayer-player so Gradle resolves
  // ONE copy app-wide (react-native-track-player pins media3Version to 1.10.1;
  // keep that comment's rationale in sync if it bumps). The Jellyfin FFmpeg
  // decoder is a native extension built against 1.9.0 — upgrade only together
  // with exoplayer-player. No DASH/SmoothStreaming/RTSP: Jellyfin never serves
  // them here, and plugins/withExcludeMedia3Dash.ts excludes them globally.
  def media3Version = rootProject.ext.has('media3Version') ? rootProject.ext.get('media3Version') : '1.11.1'
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
  implementation "androidx.media3:media3-ui:${media3Version}"
  implementation "androidx.media3:media3-common:${media3Version}"
  implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.9.0+1"

  // Google Cast SDK, used by the Cast support (expo.modules.mpvplayer.cast). 23.0.0 depends
  // on androidx.mediarouter 1.9.0-beta01, which needs compileSdk 37 and Android Gradle
  // plugin 9.1; raise it together with compileSdk. Linked on Android TV too, where the
  // module answers isAvailable() false and never touches it.
  implementation 'com.google.android.gms:play-services-cast-framework:22.3.1'
  // The SDK's dialogs, button and expanded controls build on these; declared here so the
  // module sees their classes and resources (R classes are not transitive).
  implementation 'androidx.appcompat:appcompat:1.7.0'
  implementation 'androidx.mediarouter:mediarouter:1.7.0'

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.17'
  testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.1'
  testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.1'
}
