buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${rootProject.ext.has('kotlinVersion') ? rootProject.ext.get('kotlinVersion') : '2.1.20'}")
  }
}

apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.mpvplayer'
version = '0.7.6'

expoModule {
  canBePublished false
}

android {
  namespace "expo.modules.mpvplayer"
  defaultConfig {
    versionCode 1
    versionName "0.7.6"
    ndk {
      // Architectures supported by mpv-android
      abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
    }
  }
  buildFeatures {
    compose true
  }
  sourceSets {
    main {
      jniLibs.srcDirs = ['libs']
    }
  }
}

dependencies {
  // libmpv from Maven Central
  implementation 'dev.jdtech.mpv:libmpv:1.0.0'

  // Jetpack Compose dependencies matching @expo/ui
  implementation 'androidx.compose.foundation:foundation-android:1.10.6'
  implementation 'androidx.compose.ui:ui-android:1.10.6'
  implementation "androidx.compose.material3:material3:1.5.0-alpha17"
  implementation 'androidx.compose.material3:material3-android:1.5.0-alpha17'
  implementation 'androidx.compose.material:material-icons-core:1.7.8'
  implementation 'androidx.compose.material:material-icons-extended:1.7.8'
  implementation 'androidx.lifecycle:lifecycle-runtime:2.10.0'
  implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
  implementation 'androidx.activity:activity-ktx:1.9.3'
  implementation 'androidx.savedstate:savedstate-ktx:1.2.1'
  implementation 'androidx.core:core-ktx:1.18.0'
  // Android TV Compose material
  implementation 'androidx.tv:tv-material:1.0.0'

  // Media3/ExoPlayer engine for the native chrome (ExoPlayerEngine). Same
  // coordinates and versions as modules/exoplayer-player so Gradle resolves
  // ONE copy app-wide (react-native-track-player pins media3Version to 1.10.1;
  // keep that comment's rationale in sync if it bumps). The Jellyfin FFmpeg
  // decoder is a native extension built against 1.9.0 — upgrade only together
  // with exoplayer-player. No DASH/SmoothStreaming/RTSP: Jellyfin never serves
  // them here, and plugins/withExcludeMedia3Dash.ts excludes them globally.
  def media3Version = rootProject.ext.has('media3Version') ? rootProject.ext.get('media3Version') : '1.10.1'
  implementation "androidx.media3:media3-exoplayer:${media3Version}"
  implementation "androidx.media3:media3-exoplayer-hls:${media3Version}"
  implementation "androidx.media3:media3-ui:${media3Version}"
  implementation "androidx.media3:media3-common:${media3Version}"
  implementation "org.jellyfin.media3:media3-ffmpeg-decoder:1.9.0+1"

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16.1'
  testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
  testImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
}
