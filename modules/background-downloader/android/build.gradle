apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.backgrounddownloader'
version = '1.0.0'

expoModule {
  canBePublished false
}

android {
  namespace "expo.modules.backgrounddownloader"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
