# Override both names for a second worktree so setup never adopts another checkout's container.
name: ${SYNCPLAY_PROJECT:-streamyfin-syncplay-e2e}
services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11@sha256:aefb67e6a7ff1debdd154a78a7bbb780fd0c873d8639210a7f6a2016ad2b35db
    container_name: ${SYNCPLAY_CONTAINER:-streamyfin-syncplay-e2e-jellyfin}
    ports:
      - "${SYNCPLAY_BIND:-127.0.0.1}:${SYNCPLAY_PORT:-18096}:8096"
    volumes:
      - ./.state/config:/config
      - ./.state/cache:/cache
      - ./.state/media:/media:ro
      - ./.state/catalog/movies:/catalog/movies:ro
      - ./.state/catalog/shows:/catalog/shows:ro
      - ./.state/catalog/music:/catalog/music:ro
    environment:
      JELLYFIN_PublishedServerUrl: "http://${SYNCPLAY_HOST:-127.0.0.1}:${SYNCPLAY_PORT:-18096}"
    restart: "no"
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0
    container_name: ${SYNCPLAY_SEERR_CONTAINER:-streamyfin-syncplay-e2e-seerr}
    ports:
      - "${SYNCPLAY_BIND:-127.0.0.1}:${SYNCPLAY_SEERR_PORT:-15055}:5055"
    volumes:
      - ./.state/seerr:/app/config
    environment:
      TZ: UTC
    restart: "no"
    depends_on:
      - jellyfin
