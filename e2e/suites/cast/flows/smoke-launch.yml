# Tier 1 smoke flow: the app launches to its server screen. Proves the Maestro pipeline on
# a fresh debug build before any cast flow exists. Run with e2e/bench/maestro.py.
appId: com.fredrikburmester.streamyfin
---
- launchApp:
    clearState: true
# A cold start on a CI emulator takes a while: the JS bundle loads before the first screen.
- extendedWaitUntil:
    visible: "Enter the URL to your Jellyfin server"
    timeout: 60000
- assertVisible: "Connect"
